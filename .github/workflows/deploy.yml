name: Deploy app.zonoir.com

# The VPS pulls main, builds the SPA and switches the live release
# (see /home/zonoir/deploy.sh on the server). nginx serves the build and
# proxies /rest, /auth, /storage, /functions to self-hosted Supabase.
# Edge functions are synced separately by root: /opt/zonoir-supabase/sync-functions.sh

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-zonoir
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build and publish on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            bash ~/deploy.sh
            curl -fsS -o /dev/null https://app.zonoir.com/
            echo "Health OK"

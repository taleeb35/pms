name: Deploy app.zonoir.com

# main    -> live site   (/home/zonoir/deploy.sh)
# staging -> staging site https://staging.72-62-45-147.sslip.io (/home/zonoir/deploy-staging.sh)
# Both use the same self-hosted Supabase backend. nginx serves the build and
# proxies /rest, /auth, /storage, /functions to it.
# Edge functions are synced separately by root: /opt/zonoir-supabase/sync-functions.sh

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-zonoir-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build and publish on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            if [ "${{ github.ref_name }}" = "staging" ]; then
              bash ~/deploy-staging.sh
              curl -fsS -o /dev/null https://staging.72-62-45-147.sslip.io/
            else
              bash ~/deploy.sh
              curl -fsS -o /dev/null https://app.zonoir.com/
            fi
            echo "Health OK"
